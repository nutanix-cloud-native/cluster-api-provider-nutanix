$kind: collection
description: |-
  Prism Central calls used to study VM create for CAPX.
  Scope is POST /api/vmm/v4.3/ahv/config/vms, the parent task, and Get VM.
  Error codes are the ones the create exercise expects. Live bodies are saved
  as Postman examples after a run against Prism Central.
variables:
  baseUrl: https://10.116.60.127:9440
  PE_UUID: ""
  SUBNET_UUID: ""
  IMAGE_UUID: ""
  REQ_ID: ""
  TASK_ID: ""
  VM_UUID: ""
  REQ_ID_C5: ""
  REQ_ID_D2: ""
  DENIED_SUBNET_UUID: ""
  EXHAUSTED_SUBNET_UUID: ""
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      const hdr = pm.request.headers.get('Authorization') || '';
      if (hdr.indexOf('bm9ib2R5On') !== -1) return;
      const user = pm.environment.get('basicAuthUsername');
      const pass = pm.environment.get('basicAuthPassword');
      if (!user || !pass) return;
      pm.request.headers.upsert({
        key: 'Authorization',
        value: 'Basic ' + Buffer.from(user + ':' + pass).toString('base64')
      });
