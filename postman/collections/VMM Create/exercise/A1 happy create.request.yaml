$kind: http-request
description: |-
  A1. Happy create. Saves TASK_ID and the exact body for A2.
url: '{{baseUrl}}/api/vmm/v4.3/ahv/config/vms'
method: POST
order: 1000
settings:
  strictSSL: false
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: NTNX-Request-Id
    value: '{{REQ_ID}}'
body:
  type: json
  content: |-
    {
      "name": "capx-vmm-{{REQ_ID}}",
      "memorySizeBytes": 4294967296,
      "numSockets": 2,
      "numCoresPerSocket": 2,
      "hardwareClockTimezone": "UTC",
      "cluster": { "extId": "{{PE_UUID}}" },
      "nics": [{
        "nicNetworkInfo": {
          "$objectType": "vmm.v4.ahv.config.VirtualEthernetNicNetworkInfo",
          "subnet": { "extId": "{{SUBNET_UUID}}" }
        }
      }],
      "disks": [{
        "backingInfo": {
          "$objectType": "vmm.v4.ahv.config.VmDisk",
          "diskSizeBytes": 21474836480,
          "dataSource": {
            "reference": {
              "$objectType": "vmm.v4.ahv.config.ImageReference",
              "imageExtId": "{{IMAGE_UUID}}"
            }
          }
        }
      }]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const id = pm.variables.replaceIn('{{$guid}}');
      pm.environment.set('REQ_ID', id);
      pm.request.headers.upsert({ key: 'NTNX-Request-Id', value: id });
      const raw = pm.request.body && pm.request.body.raw;
      if (raw) {
        const body = JSON.parse(raw);
        if (body && typeof body === 'object' && !Array.isArray(body)) {
          body.name = 'capx-vmm-' + id;
          const next = JSON.stringify(body);
          pm.request.body.update(next);
          pm.environment.set('LAST_CREATE_BODY', next);
        }
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      pm.test('create accepted', function () {
        pm.response.to.have.status(202);
        pm.expect(json.data && json.data.extId).to.be.a('string').and.not.empty;
      });
      if (json.data && json.data.extId) pm.environment.set('TASK_ID', json.data.extId);
