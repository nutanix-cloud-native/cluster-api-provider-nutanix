$kind: http-request
description: |-
  C7. Unknown image UUID. Expect 400 VMM-31201.
url: '{{baseUrl}}/api/vmm/v4.3/ahv/config/vms'
method: POST
order: 14000
settings:
  strictSSL: false
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: NTNX-Request-Id
    value: '{{REQ_ID}}'
body:
  type: json
  content: |-
    {
      "name": "capx-vmm-{{REQ_ID}}",
      "memorySizeBytes": 4294967296,
      "numSockets": 2,
      "numCoresPerSocket": 2,
      "hardwareClockTimezone": "UTC",
      "cluster": {
        "extId": "{{PE_UUID}}"
      },
      "nics": [
        {
          "nicNetworkInfo": {
            "$objectType": "vmm.v4.ahv.config.VirtualEthernetNicNetworkInfo",
            "subnet": {
              "extId": "{{SUBNET_UUID}}"
            }
          }
        }
      ],
      "disks": [
        {
          "backingInfo": {
            "$objectType": "vmm.v4.ahv.config.VmDisk",
            "diskSizeBytes": 21474836480,
            "dataSource": {
              "reference": {
                "$objectType": "vmm.v4.ahv.config.ImageReference",
                "imageExtId": "00000000-0000-0000-0000-000000000003"
              }
            }
          }
        }
      ]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const id = pm.variables.replaceIn('{{$guid}}');
      pm.environment.set('REQ_ID', id);
      pm.request.headers.upsert({ key: 'NTNX-Request-Id', value: id });
      const raw = pm.request.body && pm.request.body.raw;
      if (raw) {
        const body = JSON.parse(raw);
        if (body && typeof body === 'object' && !Array.isArray(body)) {
          body.name = 'capx-vmm-' + id;
          const next = JSON.stringify(body);
          pm.request.body.update(next);
          pm.environment.set('LAST_CREATE_BODY', next);
        }
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      pm.test('C7 unknown image', async function () {
        pm.expect([400, 202]).to.include(pm.response.code);
        if (pm.response.code !== 202) return;
        const status = await pollTask(json.data && json.data.extId);
        console.log('C7 task', status);
        pm.expect(status).to.eql('FAILED');
      });
      async function pollTask(taskId) {
        const base = pm.variables.get('baseUrl');
        const auth = 'Basic ' + Buffer.from(pm.environment.get('basicAuthUsername') + ':' + pm.environment.get('basicAuthPassword')).toString('base64');
        let status = '';
        for (let i = 0; i < 20; i++) {
          const response = await new Promise((resolve, reject) => {
            pm.sendRequest({
              url: base + '/api/prism/v4.4/config/tasks/' + taskId,
              method: 'GET',
              header: { Authorization: auth, Accept: 'application/json' }
            }, (err, res) => (err ? reject(err) : resolve(res)));
          });
          const body = response.json();
          status = body && body.data && body.data.status;
          if (['SUCCEEDED', 'FAILED', 'CANCELED', 'ABORTED'].includes(status)) return status;
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        return status;
      }
