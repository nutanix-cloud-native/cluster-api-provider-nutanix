$kind: http-request
description: |-
  B2. NTNX-Request-Id is not a UUID. Expect 400 VMM-30401.
url: '{{baseUrl}}/api/vmm/v4.3/ahv/config/vms'
method: POST
order: 7000
settings:
  strictSSL: false
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: NTNX-Request-Id
    value: '{{REQ_ID}}'
body:
  type: json
  content: |-
    {
      "name": "capx-vmm-{{REQ_ID}}",
      "memorySizeBytes": 4294967296,
      "numSockets": 2,
      "numCoresPerSocket": 2,
      "hardwareClockTimezone": "UTC",
      "cluster": { "extId": "{{PE_UUID}}" },
      "nics": [{
        "nicNetworkInfo": {
          "$objectType": "vmm.v4.ahv.config.VirtualEthernetNicNetworkInfo",
          "subnet": { "extId": "{{SUBNET_UUID}}" }
        }
      }],
      "disks": [{
        "backingInfo": {
          "$objectType": "vmm.v4.ahv.config.VmDisk",
          "diskSizeBytes": 21474836480,
          "dataSource": {
            "reference": {
              "$objectType": "vmm.v4.ahv.config.ImageReference",
              "imageExtId": "{{IMAGE_UUID}}"
            }
          }
        }
      }]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.request.headers.upsert({ key: 'NTNX-Request-Id', value: 'not-a-uuid' });
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      pm.test('B2 request id not a uuid', function () {
        pm.response.to.have.status(400);
        const err = json && json.data && json.data.error;
        const msg = Array.isArray(err) ? err[0] : err;
        pm.expect(msg && msg.code, 'error code').to.eql('VMM-30401');
      });
