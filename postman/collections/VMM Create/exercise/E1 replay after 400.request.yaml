$kind: http-request
description: |-
  E1. Replay the C5 request id. Expect the same 400 and no VM.
url: '{{baseUrl}}/api/vmm/v4.3/ahv/config/vms'
method: POST
order: 18000
settings:
  strictSSL: false
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: NTNX-Request-Id
    value: '{{REQ_ID}}'
body:
  type: json
  content: |-
    {
      "name": "capx-vmm-{{REQ_ID}}",
      "memorySizeBytes": 4294967296,
      "numSockets": 2,
      "numCoresPerSocket": 2,
      "hardwareClockTimezone": "UTC",
      "cluster": { "extId": "{{PE_UUID}}" },
      "nics": [{
        "nicNetworkInfo": {
          "$objectType": "vmm.v4.ahv.config.VirtualEthernetNicNetworkInfo",
          "subnet": { "extId": "{{SUBNET_UUID}}" }
        }
      }],
      "disks": [{
        "backingInfo": {
          "$objectType": "vmm.v4.ahv.config.VmDisk",
          "diskSizeBytes": 21474836480,
          "dataSource": {
            "reference": {
              "$objectType": "vmm.v4.ahv.config.ImageReference",
              "imageExtId": "{{IMAGE_UUID}}"
            }
          }
        }
      }]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const id = pm.environment.get('REQ_ID_C5');
      pm.environment.set('REQ_ID', id);
      pm.request.headers.upsert({ key: 'NTNX-Request-Id', value: id });
      const raw = pm.environment.get('LAST_CREATE_BODY_C5');
      if (raw) pm.request.body.update(raw);
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      pm.test('E1 replay returns the same C5 result', function () {
        const first = pm.environment.get('C5_HTTP');
        pm.expect(String(pm.response.code)).to.eql(first);
        if (first === '202') {
          pm.expect(json.data && json.data.extId).to.eql(pm.environment.get('TASK_ID_C5'));
        }
      });
