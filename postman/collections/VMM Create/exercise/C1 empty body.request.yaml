$kind: http-request
description: |-
  C1. Empty object. Expect 400.
url: '{{baseUrl}}/api/vmm/v4.3/ahv/config/vms'
method: POST
order: 9000
settings:
  strictSSL: false
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: NTNX-Request-Id
    value: '{{REQ_ID}}'
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const id = pm.variables.replaceIn('{{$guid}}');
      pm.environment.set('REQ_ID', id);
      pm.request.headers.upsert({ key: 'NTNX-Request-Id', value: id });
      const raw = pm.request.body && pm.request.body.raw;
      if (raw) {
        const body = JSON.parse(raw);
        if (body && typeof body === 'object' && !Array.isArray(body)) {
          body.name = 'capx-vmm-' + id;
          const next = JSON.stringify(body);
          pm.request.body.update(next);
          pm.environment.set('LAST_CREATE_BODY', next);
        }
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      pm.test('C1 empty body', function () {
        pm.response.to.have.status(400);
      });
