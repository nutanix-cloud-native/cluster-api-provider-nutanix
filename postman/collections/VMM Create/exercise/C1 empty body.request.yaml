$kind: http-request
description: |-
  C1. Empty object. Expect 400.
url: '{{baseUrl}}/api/vmm/v4.3/ahv/config/vms'
method: POST
order: 9000
settings:
  strictSSL: false
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: NTNX-Request-Id
    value: '{{REQ_ID}}'
body:
  type: json
  content: |-
    {}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const id = pm.variables.replaceIn('{{$guid}}');
      pm.environment.set('REQ_ID', id);
      pm.request.headers.upsert({ key: 'NTNX-Request-Id', value: id });
      pm.request.body.update('{}');
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      const taskId = json && json.data && json.data.extId;
      pm.test('C1 empty body is 400 or 202 and its task finishes', async function () {
        pm.expect([400, 202]).to.include(pm.response.code);
        if (pm.response.code !== 202 || !taskId) {
          return;
        }
        const base = pm.variables.get('baseUrl');
        const user = pm.environment.get('basicAuthUsername');
        const pass = pm.environment.get('basicAuthPassword');
        const auth = 'Basic ' + Buffer.from(user + ':' + pass).toString('base64');
        let status = '';
        for (let i = 0; i < 20; i++) {
          const response = await new Promise((resolve, reject) => {
            pm.sendRequest({
              url: base + '/api/prism/v4.4/config/tasks/' + taskId,
              method: 'GET',
              header: { Authorization: auth, Accept: 'application/json' }
            }, (err, res) => (err ? reject(err) : resolve(res)));
          });
          const body = response.json();
          status = body && body.data && body.data.status;
          if (['SUCCEEDED', 'FAILED', 'CANCELED', 'ABORTED'].includes(status)) {
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        console.log('C1 task', status);
        pm.expect(['SUCCEEDED', 'FAILED']).to.include(status);
      });
