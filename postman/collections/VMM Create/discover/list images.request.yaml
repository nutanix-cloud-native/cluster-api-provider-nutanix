$kind: http-request
description: |-
  Saves the first image extId as IMAGE_UUID.
url: '{{baseUrl}}/api/vmm/v4.3/content/images'
method: GET
order: 3000
settings:
  strictSSL: false
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      let json = {};
      try { json = pm.response.json(); } catch (e) { json = {}; }
      const rows = Array.isArray(json.data) ? json.data : [];
      pm.test('image list', function () {
        pm.response.to.have.status(200);
        pm.expect(rows.length).to.be.above(0);
      });
      const row = rows.find((item) => item && item.extId) || {};
      if (row.extId) {
        pm.environment.set('IMAGE_UUID', row.extId);
        console.log('IMAGE_UUID', row.extId, row.name || '');
      }
