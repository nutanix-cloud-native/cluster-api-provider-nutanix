---
apiVersion: v1
kind: Secret
metadata:
  name: "${CLUSTER_NAME}"
stringData:
  credentials: |
    [
      {
        "type": "basic_auth",
        "data": {
          "prismCentral":{
            "username": "${NUTANIX_PROJECT_SCOPE_USER}",
            "password": "${NUTANIX_PROJECT_SCOPE_PASSWORD}"
          },
          "prismElements": null
        }
      }
    ]
